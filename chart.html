<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitcoin Chart</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #1e3a8a 0%, #0f172a 100%);
        }
        .card {
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            background-color: rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body class="gradient-bg text-gray-100 min-h-screen">
    <!-- Header -->
    <header class="py-6 px-4 md:px-8 border-b border-gray-800 fixed top-0 w-full z-10">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <img src="https://storage.googleapis.com/workspace-0f70711f-8b4e-4d94-86f1-2a93ccde5887/image/aacc5ac0-4771-4860-9ed9-77b9d81c4dd8.png" alt="Bitcoin logo" class="w-10 h-10" />
                <h1 class="text-2xl font-bold">BitInvest</h1>
            </div>
            <nav>
                <ul class="flex space-x-6">
                    <li><a href="hamburgerIcon.html" class="hover:text-blue-400 transition">Back to Dashboard</a></li>
                    
                </ul>
      
            </nav>
        </div>
        
    </header>
    
    <main class="container mx-auto py-8 px-4 md:px-8 mt-20">
        <!-- Price Chart -->
        <section class="mb-12">
            <div class="card rounded-xl p-6 shadow-lg border border-gray-800">
                <div class="flex flex-col md:flex-row justify-between items-center mb-4">
                    <div>
                        <div class="flex items-center space-x-4 mb-2">
                            <img src="https://storage.googleapis.com/workspace-0f70711f-8b4e-4d94-86f1-2a93ccde5887/image/cc0489f6-d27d-4382-a2c7-a0abba836d39.png" alt="Bitcoin icon" class="w-12 h-12" />
                            <h2 class="text-3xl font-bold">Bitcoin (BTC)</h2>
                        </div>
                        <p class="text-gray-400">Current Market</p>
                    </div>
                    <div>
                        <p class="text-4xl font-bold" id="btc-price">$0.00</p>
                        <p class="text-right" id="price-change">
                            <span id="change-amount">0.00%</span>
                            <span id="change-icon"><i class="fas fa-minus"></i></span>
                        </p>
                    </div>
                </div>
                <div id="price-chart" style="height: 400px; background-color: rgba(255,255,255,0.03); border-radius: 0.5rem;">
                    <img src="https://storage.googleapis.com/workspace-0f70711f-8b4e-4d94-86f1-2a93ccde5887/image/b5d0d25f-30a5-4128-81a0-45af23166ad4.png" alt="Bitcoin price chart" class="w-full h-full object-cover rounded" />
                </div>
            </div>
        </section>
    </main>
    
    <footer class="py-6 px-4 md:px-8 border-t border-gray-800 mt-12">
        <div class="container mx-auto">
            <div class="flex flex-col md:flex-row justify-between items-center">
                <div class="flex items-center space-x-2 mb-4 md:mb-0">
                    <img src="https://storage.googleapis.com/workspace-0f70711f-8b4e-4d94-86f1-2a93ccde5887/image/7e704a4f-f5f0-4889-b723-dcc0a2047554.png" alt="BitInvest logo" class="w-8 h-8" />
                    <span class="font-medium">BitInvest</span>
                </div>
                <div class="text-sm text-gray-400">
                    <p>© 2025 BitInvest. All rights reserved.</p>
                </div>
                <div class="flex space-x-4 mt-4 md:mt-0">
                    <a href="#" class="text-gray-400 hover:text-white transition"><i class="fab fa-twitter"></i></a>
                    <a href="#" class="text-gray-400 hover:text-white transition"><i class="fab fa-telegram"></i></a>
                    <a href="#" class="text-gray-400 hover:text-white transition"><i class="fab fa-github"></i></a>
                </div>
            </div>
        </div>
    </footer>
    
    <script>
        // Mock price update
        document.getElementById('btc-price').textContent = '$60,000';
        document.getElementById('change-amount').textContent = '+2.5%';
        document.getElementById('change-icon').innerHTML = '<i class="fas fa-arrow-up text-green-500"></i>';
    </script>
</body>
</html>
